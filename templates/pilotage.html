  const police=document.querySelector('link[href*="fonts.googleapis.com"]');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+reset+'</style></head><body>'
    +'<title>'+(etat.titre||"Pilotage SEO").replace(/&/g,"&amp;").replace(/</g,"&lt;")+'</title>\n'+(police?'<link rel="stylesheet" href="'+police.getAttribute("href").replace(/&/g,"&amp;")+'">\n':"")
    +'<style id="css">'+css+'</style>\n'+(pageCss?'<style id="css-page">'+pageCss+'</style>\n':"")+'<main id="app"><p class="pl-vide">Chargement du tableau de bord…</p></main>\n'
    +(hote?'<template id="hote">'+hote.innerHTML+'</template>\n':"")
    +'<script type="application/json" id="etat">'+json+'<\/script>\n<script id="code">'+code+'<\/script></body></html>';
}
async function enregistrer(){
  if(!artifact){dire("Enregistrement impossible ici : ouvrez la page dans claude.ai.");return}
  dire("Enregistrement…");
  try{await artifact.publish(documentComplet());enAttente=false;dire("Enregistré. Les routines exécuteront les actions validées.")}
  catch(e){const c=e&&e.code;enAttente=false;
    if(c==="conflict")dire("Une autre modification vient d'être enregistrée : la page se recharge, refaites votre choix si besoin.");
    else if(c==="not_writer"||c==="not_granted"){lectureSeule=true;rendre();dire("Lecture seule : votre modification n'a pas été enregistrée.")}
    else dire("Échec de l'enregistrement ("+(c||"erreur")+"). Réessayez dans un instant.")}
}
const hote=document.getElementById("hote");
if(hote&&!document.getElementById("hote-rendu")){const d=document.createElement("div");d.id="hote-rendu";d.append(hote.content.cloneNode(true));app.after(d)}
rendre();
if(window.claude&&window.claude.use){window.claude.use("artifact").then(a=>{artifact=a;if(!a){lectureSeule=true;rendre()}}).catch(()=>{lectureSeule=true;rendre()})}
else{lectureSeule=true;rendre()}
})();
</script>
