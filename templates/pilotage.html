<title>Pilotage SEO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
/* Programme de pilotage sur plusieurs mois, mis en page comme un conducteur : en-tête de programme (surtitre, titre, ardoise),
   onglets collants, synthèse, décisions, roadmap chantier × mois avec frise des phases, plan d'actions filtrable,
   backlinks mois par mois (et leur guide), reporting. Titres en police d'affiche (--titre), étiquettes et texte en police de lecture (--texte). */
#app{
  --fond:#f3f4f6;--carte:#ffffff;--creux:#e9ebef;--encre:#14161c;--encre2:#454b59;--doux:#646a7a;--trait:#d9dce3;--trait-fort:#c3c8d2;
  --accent:#2a45b0;--accent-doux:#e4e8f8;--attente:#985a00;--attente-doux:#fbefd9;--ok:#12704a;--ok-doux:#dff2e8;
  --non:#b0281f;--non-doux:#fbe4e2;--info:#1f5f8b;--info-doux:#e0edf6;
  --titre:"Newsreader",Georgia,"Times New Roman",serif;
  --texte:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chiffre:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cta:var(--accent);--cta-texte:#ffffff;--lien:var(--accent);--rayon:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app{
  --fond:#101218;--carte:#171a22;--creux:#1d212b;--encre:#eceef3;--encre2:#b4bac8;--doux:#8a91a3;--trait:#2a2f3b;--trait-fort:#3a4050;
  --accent:#8ea4f5;--accent-doux:#1e2747;--attente:#e8a84a;--attente-doux:#33270f;--ok:#6bcb9c;--ok-doux:#15301f;
  --non:#f08a80;--non-doux:#3a1c1a;--info:#7fb6dd;--info-doux:#16283a;--cta-texte:#101218;color-scheme:dark}}
:root[data-theme="dark"] #app{
  --fond:#101218;--carte:#171a22;--creux:#1d212b;--encre:#eceef3;--encre2:#b4bac8;--doux:#8a91a3;--trait:#2a2f3b;--trait-fort:#3a4050;
  --accent:#8ea4f5;--accent-doux:#1e2747;--attente:#e8a84a;--attente-doux:#33270f;--ok:#6bcb9c;--ok-doux:#15301f;
  --non:#f08a80;--non-doux:#3a1c1a;--info:#7fb6dd;--info-doux:#16283a;--cta-texte:#101218;color-scheme:dark}
/* Un projet peut imposer sa charte sombre (theme.mode = "sombre", sans theme.clair) : la page suit alors la marque, pas le thème du lecteur. */
#app.pl-sombre{
  --fond:#101218;--carte:#171a22;--creux:#1d212b;--encre:#eceef3;--encre2:#b4bac8;--doux:#8a91a3;--trait:#2a2f3b;--trait-fort:#3a4050;
  --accent:#8ea4f5;--accent-doux:#1e2747;--attente:#e8a84a;--attente-doux:#33270f;--ok:#6bcb9c;--ok-doux:#15301f;
  --non:#f08a80;--non-doux:#3a1c1a;--info:#7fb6dd;--info-doux:#16283a;--cta-texte:#101218;color-scheme:dark}
#app{background:var(--fond);color:var(--encre);font:14.5px/1.55 var(--texte);-webkit-font-smoothing:antialiased;max-width:1200px;margin:0 auto;padding-inline:20px;padding-block:0 96px;display:grid;gap:22px;min-width:0}
#app *{box-sizing:border-box}
#app h1,#app h2,#app h3,#app h4{margin:0;text-wrap:balance;color:var(--encre)}
#app h1{font:600 clamp(1.9rem,4.6vw,2.9rem)/1.05 var(--titre);letter-spacing:-.01em}
#app h2{font:600 clamp(1.3rem,2.4vw,1.6rem)/1.2 var(--titre);letter-spacing:-.005em}
#app h3{font:600 .72rem/1.3 var(--texte);text-transform:uppercase;letter-spacing:.11em;color:var(--doux)}
#app h4{font:600 .72rem/1.3 var(--texte);text-transform:uppercase;letter-spacing:.08em;color:var(--encre2)}
#app p{margin:0}
#app a{color:var(--lien);text-underline-offset:2px}
#app a:focus-visible,#app button:focus-visible,#app input:focus-visible,#app select:focus-visible,#app summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* en-tête de programme */
.pl-tete{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px 28px;align-items:end;padding-block:34px 22px;border-bottom:1px solid var(--trait)}
.pl-surtitre{font:500 .72rem/1.4 var(--chiffre);letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.pl-tete h1{margin:8px 0 10px}
.pl-sous{color:var(--encre2);max-width:64ch;font-size:.98rem}
.pl-ardoise{font:.72rem/1.9 var(--chiffre);color:var(--encre2);border:1px solid var(--trait-fort);background:var(--carte);border-radius:4px;padding:10px 14px;min-width:240px;display:grid;letter-spacing:.02em}
.pl-ardoise>span{text-transform:uppercase}
.pl-ardoise b{color:var(--encre);font-weight:500;text-transform:none}
.pl-ardoise .pl-liens{font:500 .82rem/1.5 var(--texte);padding-top:6px;margin-top:4px;border-top:1px dashed var(--trait);text-transform:none;letter-spacing:0}
.pl-enreg{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;color:var(--encre2);margin-top:12px;min-height:1.2em}
.pl-enreg:not(:empty)::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.pl-liens{display:flex;flex-wrap:wrap;gap:4px 14px}
@media (max-width:760px){.pl-tete{grid-template-columns:minmax(0,1fr);padding-block:26px 18px}.pl-ardoise{min-width:0}}
/* onglets */
.pl-onglets{display:flex;flex-wrap:wrap;gap:8px}
.pl-onglet{font:600 .9rem var(--texte);border:1px solid var(--trait-fort);background:var(--carte);color:var(--encre);border-radius:20px;padding:6px 14px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pl-onglet[aria-selected="true"]{background:var(--encre);border-color:var(--encre);color:var(--fond)}
.pl-vues{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--fond);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--trait);scrollbar-width:thin;margin-inline:-20px;padding-inline:20px}
.pl-vue{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:500 .9rem var(--texte);color:var(--doux);padding:13px 12px 11px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pl-vue:hover{color:var(--encre)}
.pl-vue[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--accent);font-weight:600}
.pl-pastille{font:500 .68rem var(--chiffre);background:var(--attente-doux);color:var(--attente);border-radius:20px;padding:1px 7px}
.pl-pastille.pl-neutre{background:var(--creux);color:var(--encre2)}
.pl-onglet[aria-selected="true"] .pl-pastille{background:var(--carte);color:var(--encre)}
.pl-mois{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--trait);scrollbar-width:thin}
.pl-mois button{font:500 .9rem var(--texte);border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:transparent;color:var(--doux);padding:9px 12px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pl-mois button[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--accent);font-weight:600}
/* structure */
.pl-projet{display:grid;gap:22px;min-width:0}
.pl-panneau{display:grid;gap:26px;min-width:0;padding-top:8px}
.pl-section{display:grid;gap:14px;min-width:0}
.pl-section>.pl-intro{color:var(--encre2);max-width:72ch}
.pl-bloc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:18px 20px;display:grid;gap:14px;align-content:start;min-width:0;margin:0}
.pl-bloc.pl-decider{border-left:3px solid var(--attente)}
.pl-entete{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px}
.pl-deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:22px;align-items:start}
.pl-synthese{font-size:1rem;max-width:72ch;color:var(--encre2)}
.pl-chapeau{font:400 clamp(1.15rem,2.2vw,1.35rem)/1.42 var(--titre);max-width:64ch;color:var(--encre)}
.pl-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.84rem;color:var(--doux)}
.pl-meta code,.pl-code{font:.78rem var(--chiffre);overflow-wrap:anywhere}
.pl-source{font:.72rem var(--chiffre);color:var(--doux)}
.pl-vide{color:var(--doux);font-style:italic;margin:0}
.pl-lien-btn{appearance:none;background:none;border:0;padding:0;font:600 .86rem var(--texte);color:var(--lien);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* tuiles */
.pl-tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.pl-tuile{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:15px 17px;display:grid;gap:6px;align-content:start;min-width:0}
button.pl-tuile{cursor:pointer}
button.pl-tuile:hover{border-color:var(--trait-fort);background:var(--creux)}
.pl-k{display:flex;align-items:center;gap:7px;font:600 .66rem/1.3 var(--texte);letter-spacing:.09em;text-transform:uppercase;color:var(--doux)}
.pl-tuile .pl-k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--trait-fort);flex:none}
.pl-tuile[data-g="valider"] .pl-k::before{background:var(--attente)}
.pl-tuile[data-g="bloquee"] .pl-k::before{background:var(--non)}
.pl-tuile[data-g="afaire"] .pl-k::before{background:var(--info)}
.pl-tuile[data-g="faite"] .pl-k::before{background:var(--ok)}
.pl-tuile[data-g="chiffre"] .pl-k::before{background:var(--accent)}
.pl-v{font:600 1.9rem/1 var(--titre);font-variant-numeric:tabular-nums;color:var(--encre)}
.pl-nt{font-size:.8rem;color:var(--encre2)}
.pl-chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.pl-chiffre{display:grid;gap:4px;padding:12px 14px;background:var(--creux);border-radius:4px}
.pl-chiffre b{font:600 1.6rem/1.05 var(--titre);font-variant-numeric:tabular-nums}
.pl-chiffre span{font-size:.82rem;color:var(--encre2)}
.pl-var-plus{color:var(--ok)}.pl-var-moins{color:var(--non)}
.pl-courbe svg{width:100%;height:auto;display:block}
/* frise des phases du programme */
.pl-phases{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:3px;min-width:0}
.pl-phase{background:var(--creux);border-radius:4px;padding:9px 12px;font-size:.8rem;color:var(--encre2);min-width:0}
.pl-phase b{display:block;color:var(--encre);font:600 1.02rem/1.25 var(--titre)}
.pl-phase .pl-source{display:block;margin-top:2px}
.pl-phase.pl-courante{background:var(--accent-doux);box-shadow:inset 0 2px 0 var(--accent)}
.pl-phase.pl-courante b{color:var(--accent)}
@media (max-width:760px){.pl-phases{grid-template-columns:minmax(0,1fr)!important}.pl-phase{grid-column:auto!important}}
/* avancement par chantier */
.pl-avance{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pl-avance li{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:.88rem}
.pl-avance .pl-lien-btn{text-align:left}
.pl-avance li>span:last-child{font:500 .78rem var(--chiffre);color:var(--doux);white-space:nowrap}
.pl-barre{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--creux);min-width:0}
.pl-barre i{display:block;height:100%}
.pl-barre i[data-g="faite"],.pl-legende i[data-g="faite"]{background:var(--ok)}
.pl-barre i[data-g="afaire"],.pl-legende i[data-g="afaire"]{background:var(--info)}
.pl-barre i[data-g="valider"],.pl-legende i[data-g="valider"]{background:var(--attente)}
.pl-barre i[data-g="bloquee"],.pl-legende i[data-g="bloquee"]{background:var(--non)}
.pl-legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.8rem;color:var(--doux)}
.pl-legende span{display:inline-flex;align-items:center;gap:6px}
.pl-legende i{display:inline-block;width:9px;height:9px;border-radius:2px}
@media (max-width:560px){.pl-avance li{grid-template-columns:minmax(0,1fr) auto}.pl-avance .pl-barre{grid-column:1/-1;grid-row:2}}
/* actions */
.pl-actions{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.pl-action{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 14px;border:1px solid var(--trait);border-radius:var(--rayon);border-left:3px solid var(--trait-fort);background:var(--carte);scroll-margin-top:64px}
.pl-action[data-statut="proposee"]{border-left-color:var(--attente)}
.pl-action[data-statut="bloquee"]{border-left-color:var(--non)}
.pl-action[data-statut="validee"],.pl-action[data-statut="en-cours"]{border-left-color:var(--info)}
.pl-action[data-statut="faite"]{border-left-color:var(--ok)}
.pl-action[data-statut="refusee"]{border-left-color:var(--non);opacity:.7}
.pl-corps{display:grid;gap:4px;min-width:0}
.pl-titre{font-weight:600;font-size:.95rem;line-height:1.38;overflow-wrap:anywhere}
.pl-corps>.pl-meta:first-of-type{color:var(--encre2)}
.pl-attend{font-size:.86rem;color:var(--non);font-weight:500;overflow-wrap:anywhere}
.pl-type{font:600 .64rem/1.6 var(--texte);text-transform:uppercase;letter-spacing:.07em;border-radius:20px;padding:1px 8px;background:var(--accent-doux);color:var(--accent)}
.pl-type[data-type="decision"]{background:var(--attente-doux);color:var(--attente)}
.pl-type[data-type="contenu"]{background:var(--info-doux);color:var(--info)}
.pl-statut{font:500 .74rem var(--chiffre);color:var(--doux)}
.pl-qui{font-weight:600;color:var(--encre2)}
.pl-prevu{font:500 .74rem var(--chiffre);border-radius:20px;padding:0 7px;background:var(--info-doux);color:var(--info)}
.pl-boutons{display:flex;flex-wrap:wrap;gap:6px;align-items:start;justify-content:end}
.pl-btn{font:600 .82rem var(--texte);border-radius:4px;padding:7px 13px;cursor:pointer;border:1px solid var(--trait-fort);background:var(--carte);color:var(--encre)}
.pl-btn.pl-oui{background:var(--cta);border-color:var(--cta);color:var(--cta-texte)}
.pl-btn.pl-non{color:var(--non)}
.pl-btn:disabled{opacity:.45;cursor:not-allowed}
.pl-note{grid-column:1/-1;display:flex;gap:8px}
.pl-note input{flex:1;min-width:0;font:inherit;font-size:.86rem;padding:7px 9px;border:1px solid var(--trait-fort);border-radius:4px;background:var(--fond);color:var(--encre)}
.pl-groupe{display:grid;gap:8px;min-width:0}
.pl-groupe+.pl-groupe{border-top:1px dashed var(--trait);padding-top:12px}
.pl-groupe>details{border-top:1px solid var(--trait);padding-top:8px}
.pl-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl-liste li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.pl-liste li::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--trait-fort);transform:translateY(-1px)}
.pl-liste.pl-fait li::before{background:var(--ok)}
.pl-liste.pl-wins li::before{background:var(--accent);border-radius:2px;transform:rotate(45deg) translateY(-1px)}
.pl-liste li>div{min-width:0;overflow-wrap:anywhere}
.pl-liste small{display:block;color:var(--doux);font-size:.8rem}
.pl-puce{display:inline-block;font:500 .68rem/1.6 var(--chiffre);border-radius:20px;padding:0 7px;background:var(--creux);color:var(--encre2);margin-left:6px;white-space:nowrap}
.pl-puce[data-g="afaire"]{background:var(--info-doux);color:var(--info)}
.pl-puce[data-g="valider"]{background:var(--attente-doux);color:var(--attente)}
.pl-puce[data-g="bloquee"]{background:var(--non-doux);color:var(--non)}
.pl-puce[data-g="faite"]{background:var(--ok-doux);color:var(--ok)}
/* roadmap */
.pl-mrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:3px}
.pl-mrow.pl-aligne{grid-template-columns:repeat(var(--n),minmax(0,1fr))}
@media (max-width:760px){.pl-mrow.pl-aligne{grid-template-columns:repeat(auto-fill,minmax(76px,1fr))}}
.pl-mbtn{appearance:none;border:1px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:4px;padding:8px 4px;font:inherit;cursor:pointer;text-align:center;min-width:0;display:grid;gap:2px;justify-items:center}
.pl-mbtn .pl-m{font:500 .68rem var(--chiffre);color:var(--doux)}
.pl-mbtn .pl-c{font:600 .88rem var(--texte)}
.pl-mbtn .pl-bar{display:block;height:4px;border-radius:2px;background:var(--accent);margin-top:4px;max-width:100%;opacity:.85}
.pl-mbtn.pl-courant .pl-m{color:var(--accent);font-weight:600}
.pl-mbtn[aria-pressed="true"]{border-color:var(--encre);box-shadow:inset 0 0 0 1px var(--encre)}
.pl-matrice{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--rayon);background:var(--carte)}
#app .pl-matrice table{font-size:.8rem}
#app .pl-matrice th,#app .pl-matrice td{text-align:center;padding:6px 4px;border-bottom:1px solid var(--trait);border-left:1px solid var(--trait);vertical-align:middle}
#app .pl-matrice tr>:first-child{text-align:left;position:sticky;left:0;background:var(--carte);border-left:0;padding-left:12px;white-space:nowrap;font-weight:600;z-index:1}
#app .pl-matrice thead th{background:var(--creux)}
#app .pl-matrice thead tr>:first-child{background:var(--creux)}
#app .pl-matrice tfoot td{font-weight:600}
#app .pl-matrice th button{appearance:none;border:0;background:none;font:600 .7rem var(--texte);letter-spacing:.05em;text-transform:uppercase;color:var(--doux);cursor:pointer;padding:4px 6px;border-radius:4px;white-space:nowrap}
#app .pl-matrice th.pl-courant button{color:var(--accent)}
#app .pl-matrice .pl-choisi{background:var(--accent-doux)}
#app .pl-matrice tr>.pl-choisi:first-child{background:var(--carte)}
.pl-cel{appearance:none;border:0;background:none;padding:2px;font:inherit;color:inherit;display:flex;flex-wrap:nowrap;gap:3px;justify-content:center;min-width:64px;width:100%}
button.pl-cel{cursor:pointer}
button.pl-cel:hover{background:var(--fond);border-radius:4px}
.pl-cel span{font:500 .7rem var(--chiffre);border-radius:20px;padding:1px 6px;min-width:22px}
.pl-cel [data-g="faite"]{background:var(--ok-doux);color:var(--ok)}
.pl-cel [data-g="afaire"]{background:var(--info-doux);color:var(--info)}
.pl-cel [data-g="valider"]{background:var(--attente-doux);color:var(--attente)}
.pl-cel [data-g="bloquee"]{background:var(--non-doux);color:var(--non)}
.pl-tete-mois .pl-cel{width:auto;min-width:0;justify-content:end}
.pl-tete-mois{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 20px;align-items:end}
.pl-tete-mois h2{margin-top:4px}
.pl-objectif{font:400 1.12rem/1.42 var(--titre);color:var(--encre);max-width:62ch;margin-top:6px}
.pl-couloirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.pl-couloir{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:12px 14px;min-width:0}
.pl-couloir h4{margin-bottom:6px}
.pl-it{font-size:.86rem;padding:8px 0;border-top:1px solid var(--trait);display:grid;gap:3px;overflow-wrap:anywhere}
.pl-couloir h4+.pl-it{border-top:0}
.pl-it .pl-meta{font-size:.76rem}
/* backlinks mois par mois */
.pl-faits{display:flex;flex-wrap:wrap;gap:8px}
.pl-fait-k{display:inline-grid;gap:1px;background:var(--creux);border-radius:4px;padding:7px 12px;min-width:0}
.pl-fait-k span{font:600 .62rem var(--texte);letter-spacing:.09em;text-transform:uppercase;color:var(--doux)}
.pl-fait-k b{font:600 .95rem var(--texte);color:var(--encre);overflow-wrap:anywhere}
.pl-cartes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.pl-carte{background:var(--carte);border:1px solid var(--trait);border-left:3px solid var(--accent);border-radius:0 var(--rayon) var(--rayon) 0;padding:12px 16px;font-size:.88rem;color:var(--encre2);min-width:0;display:grid;gap:4px}
.pl-carte b{color:var(--encre)}

<script id="code">
(function(){

const NOMS_MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];

const VUES=[["synthese","Synthèse"],["decider","À décider"],["roadmap","Roadmap"],["actions","Plan d'actions"],["liens","Backlinks"],["reporting","Reporting"]];
const brut=document.getElementById("etat").textContent;
let etat;try{etat=JSON.parse(brut)}catch(e){etat={maj:"",projets:[]}}
if(!Array.isArray(etat.projets))etat.projets=[];
const aujourdhui=new Date().toISOString().slice(0,10),ceMois=aujourdhui.slice(0,7);
let courant=null,vue="synthese",moisChoisi=null,moisRoad=null,moisLiens=null,lectureSeule=false,minuteur=null,enAttente=false,defiler=false;
const filtres={q:"",chantier:"",statut:"",mois:"",qui:""};
try{const v=localStorage.getItem("pilotage-vue");if(VUES.some(x=>x[0]===v))vue=v;courant=localStorage.getItem("pilotage-onglet")}catch(e){}
try{for(const h of decodeURIComponent((location.hash||"").slice(1)).split("/").filter(Boolean)){
  if(/^\d{4}-\d\d$/.test(h)){moisChoisi=h;vue="reporting"}else if(VUES.some(x=>x[0]===h))vue=h;else courant=h}}catch(e){}
if(!etat.projets.some(p=>p.id===courant))courant=etat.projets[0]&&etat.projets[0].id;
const app=document.getElementById("app");
const el=(t,a,...enfants)=>{const n=document.createElement(t);for(const k in a||{}){if(k==="texte")n.textContent=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]!==undefined&&a[k]!==null&&a[k]!==false)n.setAttribute(k,a[k])}for(const c of enfants.flat())if(c!=null&&c!=="")n.append(c.nodeType?c:document.createTextNode(String(c)));return n};
const RTL=/([֐-ࣿ][֐-ࣿ\s\d٪%،؟.-]*[֐-ࣿ]|[֐-ࣿ])/;
const bidi=t=>{const n=document.createDocumentFragment();String(t||"").split(RTL).forEach((m,i)=>{if(!m)return;n.append(i%2?el("bdi",{dir:"rtl",texte:m}):document.createTextNode(m))});return n};
const fr=n=>n==null||n===""?"—":Number(n).toLocaleString("fr-FR");

const euros=n=>Number(n).toLocaleString("fr-FR",{style:"currency",currency:"EUR",minimumFractionDigits:0,maximumFractionDigits:2});
const lienSur=u=>/^https?:\/\//i.test(String(u||""));
const lien=(u,t)=>lienSur(u)?el("a",{href:u,target:"_blank",rel:"noopener",texte:t}):null;
const estMois=m=>/^\d{4}-\d\d$/.test(m||"");
const nomMois=m=>{const[a,mm]=m.split("-");return NOMS_MOIS[+mm-1].replace(/^./,c=>c.toUpperCase())+" "+a};
const moisCourt=m=>{const[a,mm]=m.split("-");return MOIS_COURTS[+mm-1]+" "+a.slice(2)};
const ajouterMois=(m,n)=>{const[a,mm]=m.split("-").map(Number),t=a*12+mm-1+n;return Math.floor(t/12)+"-"+String(t%12+1).padStart(2,"0")};
const dateCourte=d=>d?d.slice(8,10)+"/"+d.slice(5,7):"";

const majuscule=t=>String(t).replace(/^./,c=>c.toUpperCase());
/* Le mois d'une action : mois_cible (programmée), sinon mois. Une action faite se range dans le mois où elle a été faite (maj) ;
   une action ouverte d'un mois passé glisse dans le mois en cours, puisqu'elle reste à faire. */
const moisDe=a=>(a.maj||a.mois||"").slice(0,7);
const moisPrevu=a=>[a.mois_cible,a.mois,(a.maj||"").slice(0,7)].find(estMois)||ceMois;
const ouverte=a=>a.statut!=="faite"&&a.statut!=="refusee";
const plusTard=a=>ouverte(a)&&moisPrevu(a)>ceMois;
const moisRoadmap=a=>a.statut==="faite"?(estMois(moisDe(a))?moisDe(a):moisPrevu(a)):a.statut==="refusee"?moisPrevu(a):(moisPrevu(a)<ceMois?ceMois:moisPrevu(a));
const groupe=a=>({proposee:"valider",bloquee:"bloquee",validee:"afaire",["en-cours"]:"afaire",faite:"faite",refusee:"refusee"})[a.statut]||"valider";
const aDecider=p=>(p.actions||[]).filter(a=>(a.statut==="proposee"||a.statut==="bloquee")&&!plusTard(a));
const decideur=p=>(p&&p.decideur)||etat.decideur||"Nathan";
function qui(a,p){
  if(a.qui)return majuscule(a.qui);
  const t=String(a.attend||"").trim();
  if(t){if(/consultant/i.test(t))return "Consultant";const m=/^([^:]{1,40}?)\s*:/.exec(t);const q=m?m[1].trim():(t.length<=40?t:"");return q?majuscule(q):decideur(p)}
  return a.statut==="proposee"||a.statut==="bloquee"?decideur(p):"Claude";
}
const chantierDe=a=>a.chantier||"pilotage";

const gainNum=a=>{const m=/\d+/.exec(String(a.gain||"").replace(/\s/g,""));return m?+m[0]:0};
function dire(msg){const z=document.getElementById("enreg");if(z)z.textContent=msg}
function aller(v,f){vue=v;if(f){Object.assign(filtres,{q:"",chantier:"",statut:"",mois:"",qui:""},f)}defiler=true;try{localStorage.setItem("pilotage-vue",v)}catch(e){}rendre()}

/* ── Cartes d'action (boutons Valider / Refuser et remarque) ── */
function carteAction(a,p){
  const li=el("li",{class:"pl-action","data-statut":a.statut,id:"action-"+a.id});
  const prevu=a.mois_cible||plusTard(a)?el("span",{class:"pl-prevu",title:"Mois prévu",texte:"prévu : "+nomMois(moisPrevu(a)).toLowerCase()}):null;
  const meta=el("div",{class:"pl-meta"},el("span",{class:"pl-type","data-type":a.type,texte:TYPES[a.type]||a.type||"Action"}),
    a.chantier?el("span",{texte:CHANTIERS[a.chantier]||a.chantier}):null,prevu,
    a.page?el("code",{texte:a.page}):null,a.gain?el("span",{texte:a.gain}):null,a.effort?el("span",{texte:"effort "+a.effort}):null,
    el("span",{class:"pl-qui",texte:qui(a,p)}),
    el("span",{class:"pl-statut",texte:(LIBELLES[a.statut]||a.statut)+(a.maj?" · "+dateCourte(a.maj):"")}));
  const corps=el("div",{class:"pl-corps"},el("div",{class:"pl-titre"},bidi(a.titre)),a.pourquoi?el("div",{class:"pl-meta"},bidi(a.pourquoi)):null,
    a.statut==="bloquee"&&a.attend?el("div",{class:"pl-attend",texte:"En attente : "+a.attend}):null,meta,
    a.note?el("div",{class:"pl-meta",texte:"Remarque : "+a.note}):null,lien(a.lien,"Voir le résultat"));
  const b=el("div",{class:"pl-boutons"});
  const changer=s=>()=>{const n=document.getElementById("note-"+a.id);if(n&&n.value.trim())a.note=n.value.trim();a.statut=s;if(s!=="bloquee")delete a.attend;a.maj=aujourdhui;programmer();rendre()};
  if(a.statut==="proposee")b.append(el("button",{class:"pl-btn pl-oui",type:"button",disabled:lectureSeule,onclick:changer("validee"),texte:"Valider"}),

  else if(a.statut==="bloquee")b.append(el("button",{class:"pl-btn pl-oui",type:"button",disabled:lectureSeule,onclick:changer("validee"),texte:"C'est débloqué"}));
  else if(a.statut==="validee"||a.statut==="refusee")b.append(el("button",{class:"pl-btn",type:"button",disabled:lectureSeule,onclick:changer("proposee"),texte:"Remettre à valider"}));
  li.append(corps,b);

function parChantier(actions,rendu){
  const g={};actions.forEach(a=>{(g[chantierDe(a)]=g[chantierDe(a)]||[]).push(a)});
  return ordreChantiers(Object.keys(g)).map(c=>el("div",{class:"pl-groupe"},el("h3",{texte:(CHANTIERS[c]||c)+" · "+g[c].length}),rendu(g[c])));
}

/* ── Chiffres ── */
function courbe(serie){
  if(!serie||serie.length<2)return el("p",{class:"pl-vide",texte:"Moins de deux semaines de données Search Console : la courbe apparaît dès la deuxième semaine."});
  const L=640,H=140,m={g:36,d:12,h:12,b:26},max=Math.max(1,...serie.map(s=>s.clics));
  const x=i=>m.g+i*(L-m.g-m.d)/(serie.length-1),y=v=>H-m.b-(v/max)*(H-m.h-m.b);
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${L} ${H}`);svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Clics par semaine sur les dernières semaines, maximum "+max);
  const ajout=(t,a)=>{const n=document.createElementNS(ns,t);for(const k in a)n.setAttribute(k,a[k]);svg.append(n);return n};
  [0,.5,1].forEach(f=>{const v=Math.round(max*f),yy=y(v);ajout("line",{x1:m.g,x2:L-m.d,y1:yy,y2:yy,stroke:"var(--trait)","stroke-width":1});
    ajout("text",{x:m.g-6,y:yy+4,"text-anchor":"end","font-size":11,fill:"var(--doux)","font-family":"var(--chiffre)"}).textContent=v});
  const pts=serie.map((s,i)=>`${x(i)},${y(s.clics)}`).join(" ");
  ajout("polygon",{points:`${x(0)},${y(0)} ${pts} ${x(serie.length-1)},${y(0)}`,fill:"var(--accent-doux)"});
  ajout("polyline",{points:pts,fill:"none",stroke:"var(--accent)","stroke-width":2,"stroke-linejoin":"round"});
  const der=serie[serie.length-1];ajout("circle",{cx:x(serie.length-1),cy:y(der.clics),r:4,fill:"var(--accent)"});
  [0,serie.length-1].forEach(i=>ajout("text",{x:x(i),y:H-6,"text-anchor":i?"end":"start","font-size":11,fill:"var(--doux)"}).textContent="sem. du "+dateCourte(serie[i].semaine));
  return svg;
}
function chiffres(k){
  k=k||{};const v=k.clics_4s_prec?Math.round((k.clics_4s-k.clics_4s_prec)/k.clics_4s_prec*100):null;
  const tuile=(val,lib,extra)=>el("div",{class:"pl-chiffre"},el("b",{texte:val}),el("span",{},lib,extra||""));
  const t=[];
  if(k.clics_4s!=null)t.push(tuile(fr(k.clics_4s),"clics sur 4 semaines ",v==null?"":el("strong",{class:v>=0?"pl-var-plus":"pl-var-moins",texte:(v>=0?"+":"")+v+" %"})));
  if(k.impressions_4s!=null)t.push(tuile(fr(k.impressions_4s),"impressions sur 4 semaines"));
  if(k.clics!=null)t.push(tuile(fr(k.clics),"clics sur le mois"));
  if(k.impressions!=null)t.push(tuile(fr(k.impressions),"impressions sur le mois"));
  if(k.top_10!=null)t.push(tuile(fr(k.top_10)+(k.pages_suivies?"/"+fr(k.pages_suivies):""),"pages en top 10 sur leur mot-clé"));
  t.push(tuile(k.prompts||"—","prompts principaux où le site est cité"));
  return el("div",{class:"pl-chiffres"},...t);
}
/* Le dernier bilan chiffré : le mois le plus récent dont le reporting a des clics ou des impressions, sinon les chiffres du projet. */
function dernierBilan(p){
  const cles=["clics","impressions","clics_4s","impressions_4s"];
  const m=Object.keys(p.mois||{}).filter(estMois).sort().reverse().find(k=>{const r=(p.mois[k]||{}).reporting||{};return cles.some(c=>r[c]!=null)});
  if(m)return{mois:m,rep:Object.assign({},m===ceMois?p.kpis||{}:{},p.mois[m].reporting)};
  return{mois:null,rep:p.kpis||{}};
}

  const enfants=[el("span",{class:"pl-k",texte:k}),el("span",{class:"pl-v"},v),nt?el("span",{class:"pl-nt"},nt):null];

/* ── Synthèse ── */
function urgentes(p){

const ecart=(a,b)=>{const[x,y]=a.split("-").map(Number),[z,w]=b.split("-").map(Number);return(z*12+w)-(x*12+y)};
/* La frise des phases du programme (p.programme.phases) : chaque phase occupe ses mois, la phase en cours ressort.

function frise(p,mois){

  if(!ph.length)return null;
  let debut=ph.reduce((a,x)=>x.debut<a?x.debut:a,ph[0].debut),fin=ph.reduce((a,x)=>x.fin>a?x.fin:a,ph[0].fin);
  if(mois&&mois.length){debut=mois[0];fin=mois[mois.length-1];ph=ph.filter(x=>x.fin>=debut&&x.debut<=fin)}
  if(!ph.length)return null;
  const n=Math.min(48,ecart(debut,fin)+1),borne=m=>m<debut?debut:m>fin?fin:m;
  return el("div",{class:"pl-phases",role:"list","aria-label":"Phases du programme",style:"--n:"+n},...ph.map(x=>{
    const d=borne(x.debut),f=borne(x.fin),cours=x.debut<=ceMois&&ceMois<=x.fin;
    return el("div",{role:"listitem",class:"pl-phase"+(cours?" pl-courante":""),style:"grid-column:"+(ecart(debut,d)+1)+" / span "+Math.max(1,Math.min(n,ecart(d,f)+1))},
      el("b",{},bidi(x.titre||"")),x.texte?el("span",{},bidi(x.texte)):null,
      el("span",{class:"pl-source",texte:(cours?"en cours · ":"")+moisCourt(x.debut)+(x.fin!==x.debut?" → "+moisCourt(x.fin):"")}))}));
}

/* La charte du projet (p.theme). Trois cas :
   - theme.clair (ou theme.sombre) présent : la page suit le thème du lecteur, jetons de theme + theme.clair en clair,
     jetons de theme + theme.sombre en sombre ;
   - theme.mode = "sombre" sans theme.clair : la page reste sombre, aux couleurs de la marque ;
   - sinon : les jetons de theme s'appliquent sur la palette claire / sombre par défaut. */
const VARS_THEME={fond:"--fond",carte:"--carte",creux:"--creux",encre:"--encre",encre2:"--encre2",doux:"--doux",trait:"--trait",trait_fort:"--trait-fort",
  accent:"--accent",accent_doux:"--accent-doux",attente:"--attente",attente_doux:"--attente-doux",ok:"--ok",ok_doux:"--ok-doux",non:"--non",non_doux:"--non-doux",
  info:"--info",info_doux:"--info-doux",cta:"--cta",cta_texte:"--cta-texte",lien:"--lien",titre:"--titre",texte:"--texte",chiffre:"--chiffre",rayon:"--rayon"};
const valeurSure=v=>typeof v==="string"&&v.length<200&&/^[^;{}<>\\]*$/.test(v);
const declarations=o=>Object.keys(VARS_THEME).filter(k=>valeurSure(o[k])).map(k=>VARS_THEME[k]+":"+o[k]).join(";");
function appliquerTheme(p){
  const t=(p&&p.theme)||{},suit=!!(t.clair||t.sombre)&&t.mode!=="sombre"&&t.mode!=="clair";
  let feuille=document.getElementById("css-theme");
  app.classList.toggle("pl-sombre",t.mode==="sombre"&&!suit);
  app.classList.toggle("pl-theme",suit);
  if(suit){
    const clair={...t,...(t.clair||{})},sombre={...t,...(t.sombre||{})};
    const fondC=valeurSure(clair.fond)?clair.fond:"",fondS=valeurSure(sombre.fond)?sombre.fond:"";
    const css="#app.pl-theme{"+declarations(clair)+";color-scheme:light}"+(fondC?"body{background:"+fondC+"}":"")
      +"@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]) #app.pl-theme{"+declarations(sombre)+";color-scheme:dark}"+(fondS?":root:not([data-theme=\"light\"]) body{background:"+fondS+"}":"")+"}"
      +":root[data-theme=\"dark\"] #app.pl-theme{"+declarations(sombre)+";color-scheme:dark}"+(fondS?":root[data-theme=\"dark\"] body{background:"+fondS+"}":"");
    if(!feuille){feuille=document.createElement("style");feuille.id="css-theme";document.head.append(feuille)}
    if(feuille.textContent!==css)feuille.textContent=css;
    for(const k in VARS_THEME)app.style.removeProperty(VARS_THEME[k]);
    document.body.style.background="";
  }else{
    if(feuille)feuille.remove();
    for(const k in VARS_THEME){if(valeurSure(t[k]))app.style.setProperty(VARS_THEME[k],t[k]);else app.style.removeProperty(VARS_THEME[k])}
    document.body.style.background=t.mode==="sombre"&&valeurSure(t.fond)?t.fond:"";
  }

    const l=document.createElement("link");l.rel="stylesheet";l.href=t.polices;l.setAttribute("data-theme-polices","");document.head.append(l)}
}
/* Le contenu hôte (page d'origine) est rendu dans une ombre (shadow DOM) : ses styles ne débordent pas sur la page. */
function rendreHote(){
  const d=el("div",{class:"pl-hote",id:"hote-rendu"}),frag=hote.content.cloneNode(true);
  frag.querySelectorAll('link[rel="stylesheet"][href^="https://fonts.googleapis.com/"]').forEach(l=>{
    if(!document.querySelector('link[data-hote-polices][href="'+CSS.escape(l.getAttribute("href"))+'"]')){const c=l.cloneNode();c.setAttribute("data-hote-polices","");c.setAttribute("data-theme-polices","");document.head.append(c)}});

}

async function enregistrer(){

}
