<title>Pilotage SEO</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style id="css">
/* Programme de pilotage sur plusieurs mois : synthèse, décisions, roadmap chantier × mois, plan d'actions filtrable, backlinks, reporting mois par mois. */
#app{
  --fond:#f3f4f1;--carte:#ffffff;--encre:#17211d;--doux:#5b6661;--trait:#dfe3de;--trait-fort:#c7cdc7;
  --accent:#2f5e52;--accent-doux:#e3ece8;--attente:#9a5b12;--attente-doux:#f7ecdc;--ok:#2d6a3e;--ok-doux:#e2efe5;
  --non:#8f2f2b;--non-doux:#f4e3e1;--info:#2c4f7c;--info-doux:#e3eaf4;
  --titre:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --texte:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chiffre:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cta:var(--accent);--cta-texte:var(--carte);--lien:var(--accent);--rayon:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app{
  --fond:#121715;--carte:#1a211e;--encre:#e7ece9;--doux:#9aa6a0;--trait:#2a332f;--trait-fort:#3a4540;
  --accent:#86c2ae;--accent-doux:#20302a;--attente:#e0a45a;--attente-doux:#342817;--ok:#84c795;--ok-doux:#1d2d22;
  --non:#e39590;--non-doux:#3a2220;--info:#9dbbe6;--info-doux:#1e2837;color-scheme:dark}}
:root[data-theme="dark"] #app{
  --fond:#121715;--carte:#1a211e;--encre:#e7ece9;--doux:#9aa6a0;--trait:#2a332f;--trait-fort:#3a4540;
  --accent:#86c2ae;--accent-doux:#20302a;--attente:#e0a45a;--attente-doux:#342817;--ok:#84c795;--ok-doux:#1d2d22;
  --non:#e39590;--non-doux:#3a2220;--info:#9dbbe6;--info-doux:#1e2837;color-scheme:dark}
/* Un projet peut imposer sa charte (theme.mode = "sombre") : la page suit alors la marque, pas le thème du lecteur. */
#app.pl-sombre{
  --fond:#121715;--carte:#1a211e;--encre:#e7ece9;--doux:#9aa6a0;--trait:#2a332f;--trait-fort:#3a4540;
  --accent:#86c2ae;--accent-doux:#20302a;--attente:#e0a45a;--attente-doux:#342817;--ok:#84c795;--ok-doux:#1d2d22;
  --non:#e39590;--non-doux:#3a2220;--info:#9dbbe6;--info-doux:#1e2837;color-scheme:dark}
#app{background:var(--fond);color:var(--encre);font:15px/1.55 var(--texte);max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:0 64px;display:grid;gap:20px;min-width:0}
#app *{box-sizing:border-box}
#app h1,#app h2,#app h3,#app h4{font-family:var(--titre);margin:0;text-wrap:balance;letter-spacing:.01em;color:var(--encre)}
#app h1{font-size:clamp(1.6rem,4.2vw,2.4rem);font-weight:700;line-height:1.08}
#app h2{font-size:1.25rem;font-weight:600}
#app h3{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--doux)}
#app h4{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--doux)}
#app p{margin:0}
#app a{color:var(--lien)}
#app a:focus-visible,#app button:focus-visible,#app input:focus-visible,#app select:focus-visible,#app summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* en-tête */
.pl-tete{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px 24px;align-items:end;padding-block:28px 4px}
.pl-surtitre{font:500 .74rem var(--chiffre);letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.pl-tete h1{margin:6px 0 6px}
.pl-sous{color:var(--doux);max-width:64ch}
.pl-ardoise{font:.78rem/1.85 var(--chiffre);color:var(--doux);border:1px solid var(--trait-fort);background:var(--carte);border-radius:var(--rayon);padding:10px 14px;min-width:250px;display:grid}
.pl-ardoise b{color:var(--encre);font-weight:500}
.pl-ardoise .pl-liens{font-family:var(--texte);font-size:.85rem;padding-top:4px}
.pl-enreg{font-size:.85rem;color:var(--doux);min-height:1.2em}
.pl-liens{display:flex;flex-wrap:wrap;gap:4px 12px}
@media (max-width:760px){.pl-tete{grid-template-columns:minmax(0,1fr)}.pl-ardoise{min-width:0}}
/* onglets */
.pl-onglets{display:flex;flex-wrap:wrap;gap:8px}
.pl-onglet{font:600 .95rem var(--titre);letter-spacing:.02em;border:1px solid var(--trait-fort);background:var(--carte);color:var(--encre);border-radius:6px;padding:8px 12px;cursor:pointer;display:flex;align-items:center;gap:8px}
.pl-onglet[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--carte)}
.pl-vues{position:sticky;top:0;z-index:5;background:var(--fond);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--trait);scrollbar-width:thin;margin-inline:-16px;padding-inline:16px}
.pl-vue{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;font:500 .95rem var(--titre);letter-spacing:.02em;color:var(--doux);padding:12px 12px 10px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pl-vue:hover{color:var(--encre)}
.pl-vue[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--accent);font-weight:600}
.pl-pastille{font:500 .72rem var(--chiffre);background:var(--attente-doux);color:var(--attente);border-radius:10px;padding:1px 7px}
.pl-pastille.pl-neutre{background:var(--trait);color:var(--doux)}
.pl-onglet[aria-selected="true"] .pl-pastille{background:var(--carte);color:var(--accent)}
.pl-mois{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--trait);scrollbar-width:thin}
.pl-mois button{font:600 .95rem var(--titre);letter-spacing:.02em;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;background:transparent;color:var(--doux);padding:8px 12px;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.pl-mois button[aria-selected="true"]{color:var(--encre);border-bottom-color:var(--accent)}
/* structure */
.pl-projet{display:grid;gap:20px;min-width:0}
.pl-panneau{display:grid;gap:20px;min-width:0}
.pl-bloc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:16px;display:grid;gap:12px;align-content:start;min-width:0;margin:0}
.pl-bloc.pl-decider{border-color:var(--attente);border-width:1px 1px 1px 4px}
.pl-entete{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.pl-deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px;align-items:start}
.pl-synthese{font-size:1.02rem;max-width:72ch}
.pl-chapeau{font:500 1.1rem/1.45 var(--titre);max-width:68ch;color:var(--encre)}
.pl-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--doux)}
.pl-meta code{font:.8rem var(--chiffre);overflow-wrap:anywhere}
.pl-vide{color:var(--doux);font-style:italic;margin:0}
.pl-lien-btn{appearance:none;background:none;border:0;padding:0;font:600 .88rem var(--texte);color:var(--lien);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
/* tuiles */
.pl-tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.pl-tuile{appearance:none;text-align:left;font:inherit;color:inherit;background:var(--carte);border:1px solid var(--trait);border-left:4px solid var(--trait-fort);border-radius:var(--rayon);padding:12px 14px;display:grid;gap:4px;align-content:start;min-width:0}
button.pl-tuile{cursor:pointer}
button.pl-tuile:hover{border-color:var(--trait-fort)}
.pl-tuile[data-g="valider"]{border-left-color:var(--attente)}
.pl-tuile[data-g="bloquee"]{border-left-color:var(--non)}
.pl-tuile[data-g="afaire"]{border-left-color:var(--info)}
.pl-tuile[data-g="faite"]{border-left-color:var(--ok)}
.pl-tuile[data-g="chiffre"]{border-left-color:var(--accent)}
.pl-k{font:600 .72rem var(--titre);letter-spacing:.08em;text-transform:uppercase;color:var(--doux)}
.pl-v{font:500 1.7rem/1.1 var(--chiffre);font-variant-numeric:tabular-nums;color:var(--encre)}
.pl-nt{font-size:.83rem;color:var(--doux)}
.pl-chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px}
.pl-chiffre{display:grid;gap:2px;padding:10px 12px;border-left:3px solid var(--trait-fort)}
.pl-chiffre b{font:500 1.5rem var(--chiffre);font-variant-numeric:tabular-nums}
.pl-chiffre span{font-size:.85rem;color:var(--doux)}
.pl-var-plus{color:var(--ok)}.pl-var-moins{color:var(--non)}
.pl-courbe svg{width:100%;height:auto;display:block}
/* avancement par chantier */
.pl-avance{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.pl-avance li{display:grid;grid-template-columns:minmax(0,12rem) minmax(0,1fr) auto;gap:6px 12px;align-items:center;font-size:.9rem}
.pl-avance .pl-lien-btn{text-align:left}
.pl-avance li>span:last-child{font:500 .8rem var(--chiffre);color:var(--doux);white-space:nowrap}
.pl-barre{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--trait);min-width:0}
.pl-barre i{display:block;height:100%}
.pl-barre i[data-g="faite"],.pl-legende i[data-g="faite"]{background:var(--ok)}
.pl-barre i[data-g="afaire"],.pl-legende i[data-g="afaire"]{background:var(--info)}
.pl-barre i[data-g="valider"],.pl-legende i[data-g="valider"]{background:var(--attente)}
.pl-barre i[data-g="bloquee"],.pl-legende i[data-g="bloquee"]{background:var(--non)}
.pl-legende{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.82rem;color:var(--doux)}
.pl-legende span{display:inline-flex;align-items:center;gap:6px}
.pl-legende i{display:inline-block;width:10px;height:10px;border-radius:3px}
@media (max-width:560px){.pl-avance li{grid-template-columns:minmax(0,1fr) auto}.pl-avance .pl-barre{grid-column:1/-1;grid-row:2}}
/* actions */
.pl-actions{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.pl-action{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:12px;border:1px solid var(--trait);border-radius:6px;border-left:4px solid var(--trait-fort);background:var(--carte);scroll-margin-top:64px}
.pl-action[data-statut="proposee"]{border-left-color:var(--attente)}
.pl-action[data-statut="bloquee"]{border-left-color:var(--non)}
.pl-action[data-statut="validee"],.pl-action[data-statut="en-cours"]{border-left-color:var(--info)}
.pl-action[data-statut="faite"]{border-left-color:var(--ok)}
.pl-action[data-statut="refusee"]{border-left-color:var(--non);opacity:.75}
.pl-corps{display:grid;gap:4px;min-width:0}
.pl-titre{font-weight:600;overflow-wrap:anywhere}
.pl-attend{font-size:.88rem;color:var(--non);font-weight:500;overflow-wrap:anywhere}
.pl-type{font:600 .72rem var(--titre);text-transform:uppercase;letter-spacing:.08em;border-radius:4px;padding:1px 6px;background:var(--accent-doux);color:var(--accent)}
.pl-type[data-type="decision"]{background:var(--attente-doux);color:var(--attente)}
.pl-type[data-type="contenu"]{background:var(--info-doux);color:var(--info)}
.pl-statut{font:500 .8rem var(--texte)}
.pl-qui{font-weight:500;color:var(--encre)}
.pl-prevu{font:500 .78rem var(--chiffre);border-radius:4px;padding:0 6px;background:var(--info-doux);color:var(--info)}
.pl-boutons{display:flex;flex-wrap:wrap;gap:6px;align-items:start;justify-content:end}
.pl-btn{font:600 .85rem var(--texte);border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid var(--trait-fort);background:var(--carte);color:var(--encre)}
.pl-btn.pl-oui{background:var(--cta);border-color:var(--cta);color:var(--cta-texte)}
.pl-btn.pl-non{color:var(--non)}
.pl-btn:disabled{opacity:.45;cursor:not-allowed}
.pl-note{grid-column:1/-1;display:flex;gap:8px}
.pl-note input{flex:1;min-width:0;font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--trait-fort);border-radius:6px;background:var(--fond);color:var(--encre)}
.pl-groupe{display:grid;gap:8px;min-width:0}
.pl-groupe+.pl-groupe{border-top:1px dashed var(--trait);padding-top:12px}
.pl-groupe>details{border-top:1px solid var(--trait);padding-top:8px}
.pl-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl-liste li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;align-items:baseline}
.pl-liste li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--trait-fort);transform:translateY(-1px)}
.pl-liste.pl-fait li::before{background:var(--ok)}
.pl-liste.pl-wins li::before{background:var(--accent);border-radius:2px;transform:rotate(45deg) translateY(-1px)}
.pl-liste li>div{min-width:0;overflow-wrap:anywhere}
.pl-liste small{display:block;color:var(--doux);font-size:.83rem}
.pl-puce{font:500 .72rem var(--chiffre);border-radius:4px;padding:0 6px;background:var(--trait);color:var(--doux);margin-left:6px;white-space:nowrap}
.pl-puce[data-g="afaire"]{background:var(--info-doux);color:var(--info)}
.pl-puce[data-g="valider"]{background:var(--attente-doux);color:var(--attente)}
.pl-puce[data-g="bloquee"]{background:var(--non-doux);color:var(--non)}
.pl-puce[data-g="faite"]{background:var(--ok-doux);color:var(--ok)}
/* roadmap */
.pl-mrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:4px}
.pl-mbtn{appearance:none;border:1px solid var(--trait);background:var(--carte);color:var(--encre);border-radius:6px;padding:8px 4px;font:inherit;cursor:pointer;text-align:center;min-width:0;display:grid;gap:2px;justify-items:center}
.pl-mbtn .pl-m{font:500 .72rem var(--chiffre);color:var(--doux)}
.pl-mbtn .pl-c{font:600 .92rem var(--titre)}
.pl-mbtn .pl-bar{display:block;height:4px;border-radius:2px;background:var(--accent);margin-top:4px;max-width:100%}
.pl-mbtn.pl-courant .pl-m{color:var(--accent);font-weight:600}
.pl-mbtn[aria-pressed="true"]{border-color:var(--encre);box-shadow:inset 0 0 0 1px var(--encre)}
.pl-matrice{overflow-x:auto;border:1px solid var(--trait);border-radius:var(--rayon);background:var(--carte)}
#app .pl-matrice table{font-size:.82rem}
#app .pl-matrice th,#app .pl-matrice td{text-align:center;padding:6px 4px;border-bottom:1px solid var(--trait);border-left:1px solid var(--trait);vertical-align:middle}
#app .pl-matrice tr>:first-child{text-align:left;position:sticky;left:0;background:var(--carte);border-left:0;padding-left:12px;white-space:nowrap;font-weight:600;z-index:1}
#app .pl-matrice tfoot td{font-weight:600}
#app .pl-matrice th button{appearance:none;border:0;background:none;font:600 .75rem var(--titre);letter-spacing:.05em;text-transform:uppercase;color:var(--doux);cursor:pointer;padding:4px 6px;border-radius:4px;white-space:nowrap}
#app .pl-matrice th.pl-courant button{color:var(--accent)}
#app .pl-matrice .pl-choisi{background:var(--accent-doux)}
#app .pl-matrice tr>.pl-choisi:first-child{background:var(--carte)}
.pl-cel{appearance:none;border:0;background:none;padding:2px;font:inherit;color:inherit;display:flex;flex-wrap:nowrap;gap:3px;justify-content:center;min-width:64px;width:100%}
button.pl-cel{cursor:pointer}
button.pl-cel:hover{background:var(--fond);border-radius:4px}
.pl-cel span{font:500 .72rem var(--chiffre);border-radius:10px;padding:1px 6px;min-width:22px}
.pl-cel [data-g="faite"]{background:var(--ok-doux);color:var(--ok)}
.pl-cel [data-g="afaire"]{background:var(--info-doux);color:var(--info)}
.pl-cel [data-g="valider"]{background:var(--attente-doux);color:var(--attente)}
.pl-cel [data-g="bloquee"]{background:var(--non-doux);color:var(--non)}
.pl-tete-mois .pl-cel{width:auto;min-width:0;justify-content:end}
.pl-tete-mois{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px 20px;align-items:end}
.pl-objectif{font:500 1.1rem/1.4 var(--titre);color:var(--encre);max-width:62ch}
.pl-couloirs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,270px),1fr));gap:12px}
.pl-couloir{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:12px 14px;min-width:0}
.pl-couloir h4{margin-bottom:6px}
.pl-it{font-size:.88rem;padding:8px 0;border-top:1px solid var(--trait);display:grid;gap:3px;overflow-wrap:anywhere}
.pl-couloir h4+.pl-it{border-top:0}
.pl-it .pl-meta{font-size:.78rem}
/* filtres */
.pl-filtres{display:grid;grid-template-columns:minmax(0,2fr) repeat(4,minmax(0,1fr)) auto;gap:8px;align-items:end}
.pl-filtres label{display:grid;gap:3px;font:600 .72rem var(--titre);letter-spacing:.06em;text-transform:uppercase;color:var(--doux);min-width:0}
.pl-filtres input,.pl-filtres select{font:inherit;font-size:.9rem;text-transform:none;letter-spacing:0;font-weight:400;padding:7px 9px;border:1px solid var(--trait-fort);border-radius:6px;background:var(--carte);color:var(--encre);min-width:0;width:100%}
.pl-compte{font:500 .8rem var(--chiffre);color:var(--doux)}
@media (max-width:860px){.pl-filtres{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.pl-filtres>label:first-child{grid-column:1/-1}}
/* tableaux */
.pl-table{overflow-x:auto}
#app table{border-collapse:collapse;width:100%;font:inherit;font-size:.88rem;color:var(--encre)}
#app th,#app td{text-align:left;padding:8px;border-bottom:1px solid var(--trait);vertical-align:top}
#app th{font:600 .75rem var(--titre);text-transform:uppercase;letter-spacing:.06em;color:var(--doux)}
#app td.pl-n{font-family:var(--chiffre);font-variant-numeric:tabular-nums;white-space:nowrap}
#app td.pl-url{font:.8rem var(--chiffre);overflow-wrap:anywhere;min-width:180px}
.pl-ia{display:flex;gap:4px;flex-wrap:wrap}
.pl-ia i{font:500 .72rem var(--chiffre);font-style:normal;border-radius:4px;padding:0 5px;background:var(--trait);color:var(--doux)}
.pl-ia i.pl-cite{background:var(--ok-doux);color:var(--ok)}
.pl-ia i.pl-nomme{background:var(--info-doux);color:var(--info)}
.pl-semaines{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pl-semaines li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:12px;border-top:1px solid var(--trait);padding-top:10px}
.pl-semaines time{font:500 .85rem var(--chiffre);color:var(--doux)}
.pl-routines{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.9rem}
.pl-routines li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--trait);padding-bottom:6px}
.pl-routines li span{color:var(--doux)}
#app details>summary{cursor:pointer;font:600 1.05rem var(--titre);list-style-position:outside}
#app details[open]>summary{margin-bottom:12px}
.pl-lecture-seule{background:var(--info-doux);color:var(--info);border-radius:6px;padding:8px 12px;font-size:.9rem}
.pl-hote{border-top:2px solid var(--trait);padding-top:8px;min-width:0}
@media (max-width:560px){#app .pl-matrice tr>:first-child{white-space:normal;min-width:7.5rem;max-width:9rem;font-size:.72rem}.pl-action{grid-template-columns:minmax(0,1fr)}.pl-boutons{justify-content:start}.pl-semaines li{grid-template-columns:minmax(0,1fr);gap:2px}.pl-bloc{padding:14px 12px}}
@media (prefers-reduced-motion:no-preference){.pl-action{transition:border-color .2s}}
</style>
<style id="css-page">body{background:var(--pl-fond,#f3f4f1);margin:0}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body{background:#121715}}:root[data-theme="dark"] body{background:#121715}</style>

<script id="code">

  svg.setAttribute("viewBox",`0 0 ${L} ${H}`);svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Clics par semaine sur les dernières semaines, maximum "+max);
  const ajout=(t,a)=>{const n=document.createElementNS(ns,t);for(const k in a)n.setAttribute(k,a[k]);svg.append(n);return n};
  [0,.5,1].forEach(f=>{const v=Math.round(max*f),yy=y(v);ajout("line",{x1:m.g,x2:L-m.d,y1:yy,y2:yy,stroke:"var(--trait)","stroke-width":1});
    ajout("text",{x:m.g-6,y:yy+4,"text-anchor":"end","font-size":11,fill:"var(--doux)","font-family":"var(--chiffre)"}).textContent=v});
  const pts=serie.map((s,i)=>`${x(i)},${y(s.clics)}`).join(" ");

const VARS_THEME={fond:"--fond",carte:"--carte",encre:"--encre",doux:"--doux",trait:"--trait",trait_fort:"--trait-fort",
  accent:"--accent",accent_doux:"--accent-doux",cta:"--cta",cta_texte:"--cta-texte",lien:"--lien",titre:"--titre",texte:"--texte",rayon:"--rayon"};
function appliquerTheme(p){
  const t=(p&&p.theme)||{};
  app.classList.toggle("pl-sombre",t.mode==="sombre");
  for(const k in VARS_THEME){if(t[k])app.style.setProperty(VARS_THEME[k],t[k]);else app.style.removeProperty(VARS_THEME[k])}
  document.body.style.background=t.fond||"";

    const l=document.createElement("link");l.rel="stylesheet";l.href=t.polices;l.setAttribute("data-theme-polices","");document.head.append(l)}
}
function rendre(){
  if(!VUES.some(x=>x[0]===vue))vue="synthese";
  const p=etat.projets.find(x=>x.id===courant);
  const total=etat.projets.reduce((s,x)=>s+aDecider(x).length,0);
  const sous=(etat.projets.length?(etat.projets.length>1?etat.projets.length+" sites · ":"")+total+" à décider":"Aucun site pour l'instant")+(etat.maj?" · mis à jour le "+dateLongue(etat.maj):"");
  const tete=el("header",{class:"pl-tete"},el("div",{},el("div",{class:"pl-surtitre",texte:"Programme de pilotage SEO et GEO"+(p&&p.nom?" · "+p.nom:"")}),
    el("h1",{texte:etat.titre||"Pilotage SEO"}),el("p",{class:"pl-sous",texte:sous}),el("div",{id:"enreg",class:"pl-enreg","aria-live":"polite"})),p?ardoise(p):null);

}
let artifact=null;
function programmer(){enAttente=true;clearTimeout(minuteur);minuteur=setTimeout(enregistrer,1500)}
function documentComplet(){
  const reset=(document.querySelector("head style")||{}).textContent||"";
  const code=document.getElementById("code").textContent,css=document.getElementById("css").textContent;
  const pageCss=(document.getElementById("css-page")||{}).textContent||"";

async function enregistrer(){
  if(!artifact){dire("Enregistrement impossible ici : ouvrez la page dans claude.ai.");return}
  dire("Enregistrement…");

const hote=document.getElementById("hote");
if(hote&&!etat.hote_mois){const d=document.createElement("div");d.id="hote-rendu";d.append(hote.content.cloneNode(true));app.after(d)}

else{lectureSeule=true;rendre()}
})();
