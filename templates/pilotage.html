<style id="css">
/* Console de pilotage : un onglet par mois. Ce qui attend une décision d'abord, puis le fait, le reste à faire, les wins, les contenus, les chiffres. */
#app{
  --fond:#f3f4f1;--carte:#ffffff;--encre:#17211d;--doux:#5b6661;--trait:#dfe3de;--trait-fort:#c7cdc7;

  --texte:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --chiffre:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --cta:var(--accent);--cta-texte:var(--carte);--lien:var(--accent);--rayon:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #app{
  --fond:#121715;--carte:#1a211e;--encre:#e7ece9;--doux:#9aa6a0;--trait:#2a332f;--trait-fort:#3a4540;
  --accent:#86c2ae;--accent-doux:#20302a;--attente:#e0a45a;--attente-doux:#342817;--ok:#84c795;--ok-doux:#1d2d22;
  --non:#e39590;--non-doux:#3a2220;--info:#9dbbe6;--info-doux:#1e2837;color-scheme:dark}}
:root[data-theme="dark"] #app{
  --fond:#121715;--carte:#1a211e;--encre:#e7ece9;--doux:#9aa6a0;--trait:#2a332f;--trait-fort:#3a4540;
  --accent:#86c2ae;--accent-doux:#20302a;--attente:#e0a45a;--attente-doux:#342817;--ok:#84c795;--ok-doux:#1d2d22;
  --non:#e39590;--non-doux:#3a2220;--info:#9dbbe6;--info-doux:#1e2837;color-scheme:dark}
/* Un projet peut imposer sa charte (theme.mode = "sombre") : la page suit alors la marque, pas le thème du lecteur. */
#app.pl-sombre{
  --fond:#121715;--carte:#1a211e;--encre:#e7ece9;--doux:#9aa6a0;--trait:#2a332f;--trait-fort:#3a4540;
  --accent:#86c2ae;--accent-doux:#20302a;--attente:#e0a45a;--attente-doux:#342817;--ok:#84c795;--ok-doux:#1d2d22;
  --non:#e39590;--non-doux:#3a2220;--info:#9dbbe6;--info-doux:#1e2837;color-scheme:dark}
#app{background:var(--fond);color:var(--encre);font:15px/1.5 var(--texte);max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;gap:20px}
#app *{box-sizing:border-box}
#app h1,#app h2,#app h3{font-family:var(--titre);margin:0;text-wrap:balance;letter-spacing:.01em;color:var(--encre)}
#app h1{font-size:1.9rem;font-weight:700}
#app h2{font-size:1.25rem;font-weight:600}
#app h3{font-size:.8rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--doux)}
#app p{margin:0}
#app a{color:var(--lien)}
#app a:focus-visible,#app button:focus-visible,#app input:focus-visible,#app summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.pl-tete{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px}

.pl-projet{display:grid;gap:20px}
.pl-bandeau{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
.pl-liens{display:flex;flex-wrap:wrap;gap:12px;font-size:.9rem}
.pl-panneau{display:grid;gap:20px}
.pl-bloc{background:var(--carte);border:1px solid var(--trait);border-radius:var(--rayon);padding:16px;display:grid;gap:12px;align-content:start;min-width:0;margin:0}
.pl-groupe>details{border-top:1px solid var(--trait);padding-top:8px}
.pl-groupe>details>summary{font-size:.98rem}
.pl-bloc.pl-decider{border-color:var(--attente);border-width:1px 1px 1px 4px}
.pl-entete{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 12px}
.pl-deux{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px;align-items:start}
.pl-synthese{font-size:1rem;max-width:72ch}
.pl-chiffres{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.pl-chiffre{display:grid;gap:2px;padding:10px 12px;border-left:3px solid var(--trait-fort)}
.pl-chiffre b{font:500 1.5rem var(--chiffre);font-variant-numeric:tabular-nums}
.pl-chiffre span{font-size:.85rem;color:var(--doux)}
.pl-var-plus{color:var(--ok)}.pl-var-moins{color:var(--non)}
.pl-courbe svg{width:100%;height:auto;display:block}
.pl-actions{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.pl-action{display:grid;grid-template-columns:1fr auto;gap:8px 16px;padding:12px;border:1px solid var(--trait);border-radius:6px;border-left:4px solid var(--trait-fort)}
.pl-action[data-statut="proposee"]{border-left-color:var(--attente)}
.pl-action[data-statut="bloquee"]{border-left-color:var(--non)}
.pl-action[data-statut="validee"],.pl-action[data-statut="en-cours"]{border-left-color:var(--info)}
.pl-action[data-statut="faite"]{border-left-color:var(--ok)}
.pl-action[data-statut="refusee"]{border-left-color:var(--non);opacity:.75}
.pl-corps{display:grid;gap:4px;min-width:0}
.pl-titre{font-weight:600;overflow-wrap:anywhere}
.pl-meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:.85rem;color:var(--doux)}
.pl-meta code{font:.8rem var(--chiffre);overflow-wrap:anywhere}
.pl-attend{font-size:.88rem;color:var(--non);font-weight:500}
.pl-type{font:600 .72rem var(--titre);text-transform:uppercase;letter-spacing:.08em;border-radius:4px;padding:1px 6px;background:var(--accent-doux);color:var(--accent)}
.pl-type[data-type="decision"]{background:var(--attente-doux);color:var(--attente)}
.pl-type[data-type="contenu"]{background:var(--info-doux);color:var(--info)}
.pl-statut{font:500 .8rem var(--texte)}
.pl-boutons{display:flex;flex-wrap:wrap;gap:6px;align-items:start;justify-content:end}
.pl-btn{font:600 .85rem var(--texte);border-radius:6px;padding:6px 12px;cursor:pointer;border:1px solid var(--trait-fort);background:var(--carte);color:var(--encre)}
.pl-btn.pl-oui{background:var(--cta);border-color:var(--cta);color:var(--cta-texte)}
.pl-btn.pl-non{color:var(--non)}
.pl-btn:disabled{opacity:.45;cursor:not-allowed}
.pl-note{grid-column:1/-1;display:flex;gap:8px}
.pl-note input{flex:1;min-width:0;font:inherit;font-size:.9rem;padding:6px 8px;border:1px solid var(--trait-fort);border-radius:6px;background:var(--fond);color:var(--encre)}
.pl-groupe{display:grid;gap:8px}
.pl-groupe+.pl-groupe{border-top:1px dashed var(--trait);padding-top:12px}
.pl-liste{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pl-liste li{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:baseline}
.pl-liste li::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--trait-fort);transform:translateY(-1px)}
.pl-liste.pl-fait li::before{background:var(--ok)}
.pl-liste.pl-wins li::before{background:var(--accent);border-radius:2px;transform:rotate(45deg) translateY(-1px)}
.pl-liste li>div{min-width:0;overflow-wrap:anywhere}
.pl-liste small{display:block;color:var(--doux);font-size:.83rem}
.pl-puce{font:500 .72rem var(--chiffre);border-radius:4px;padding:0 6px;background:var(--trait);color:var(--doux);margin-left:6px;white-space:nowrap}
.pl-puce[data-statut="en-cours"]{background:var(--info-doux);color:var(--info)}
.pl-vide{color:var(--doux);font-style:italic;margin:0}
.pl-table{overflow-x:auto}
#app table{border-collapse:collapse;width:100%;font:inherit;font-size:.88rem;color:var(--encre)}
#app th,#app td{text-align:left;padding:8px;border-bottom:1px solid var(--trait);vertical-align:top}
#app th{font:600 .75rem var(--titre);text-transform:uppercase;letter-spacing:.06em;color:var(--doux)}
#app td.pl-n{font-family:var(--chiffre);font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-ia{display:flex;gap:4px;flex-wrap:wrap}
.pl-ia i{font:500 .72rem var(--chiffre);font-style:normal;border-radius:4px;padding:0 5px;background:var(--trait);color:var(--doux)}
.pl-ia i.pl-cite{background:var(--ok-doux);color:var(--ok)}
.pl-ia i.pl-nomme{background:var(--info-doux);color:var(--info)}
.pl-semaines{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.pl-semaines li{display:grid;grid-template-columns:7.5rem 1fr;gap:12px;border-top:1px solid var(--trait);padding-top:10px}
.pl-semaines time{font:500 .85rem var(--chiffre);color:var(--doux)}
.pl-routines{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.9rem}
.pl-routines li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--trait);padding-bottom:6px}
.pl-routines li span{color:var(--doux)}
#app details>summary{cursor:pointer;font:600 1.05rem var(--titre);list-style-position:outside}
#app details[open]>summary{margin-bottom:12px}
.pl-lecture-seule{background:var(--info-doux);color:var(--info);border-radius:6px;padding:8px 12px;font-size:.9rem}
.pl-hote{border-top:2px solid var(--trait);padding-top:8px}
@media (max-width:560px){.pl-action{grid-template-columns:1fr}.pl-boutons{justify-content:start}#app h1{font-size:1.5rem}.pl-semaines li{grid-template-columns:1fr;gap:2px}.pl-deux{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.pl-action{transition:border-color .2s}}
</style>

<script id="code">
(function(){
"use strict";
const LIBELLES={proposee:"À valider",validee:"Validée",["en-cours"]:"En cours",bloquee:"Bloquée",faite:"Faite",refusee:"Refusée"};
const TYPES={decision:"Décision",optimisation:"Optimisation",contenu:"Contenu",technique:"Technique"};
const CHANTIERS={contenus:"Contenus",optimisation:"Optimisation des pages",technique:"Technique",["off-page"]:"Off-page et liens",geo:"GEO et citations IA",international:"International",securite:"Sécurité",indexation:"Indexation",design:"Design",pilotage:"Pilotage et décisions"};
const MOTEURS={openai:"ChatGPT",gemini:"Gemini",claude:"Claude"};
const NOMS_MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
const brut=document.getElementById("etat").textContent;
let etat;try{etat=JSON.parse(brut)}catch(e){etat={maj:"",projets:[]}}
if(!Array.isArray(etat.projets))etat.projets=[];
const ceMois=new Date().toISOString().slice(0,7);
let courant=null,moisChoisi=null,lectureSeule=false,minuteur=null,enAttente=false;
try{const h=(location.hash||"").slice(1);if(/^\d{4}-\d\d$/.test(h))moisChoisi=h;else if(h)courant=h;courant=courant||localStorage.getItem("pilotage-onglet")}catch(e){}
if(!etat.projets.some(p=>p.id===courant))courant=etat.projets[0]&&etat.projets[0].id;
const app=document.getElementById("app");
const el=(t,a,...enfants)=>{const n=document.createElement(t);for(const k in a||{}){if(k==="texte")n.textContent=a[k];else if(k.startsWith("on"))n.addEventListener(k.slice(2),a[k]);else if(a[k]!==undefined&&a[k]!==null&&a[k]!==false)n.setAttribute(k,a[k])}for(const c of enfants.flat())if(c!=null&&c!=="")n.append(c.nodeType?c:document.createTextNode(String(c)));return n};
const RTL=/([֐-ࣿ][֐-ࣿ\s\d٪%،؟.-]*[֐-ࣿ]|[֐-ࣿ])/;
const bidi=t=>{const n=document.createDocumentFragment();String(t||"").split(RTL).forEach((m,i)=>{if(!m)return;n.append(i%2?el("bdi",{dir:"rtl",texte:m}):document.createTextNode(m))});return n};
const fr=n=>n==null||n===""?"—":Number(n).toLocaleString("fr-FR");
const pos=n=>n==null?"—":Number(n).toLocaleString("fr-FR",{maximumFractionDigits:1});
const lienSur=u=>/^https?:\/\//i.test(String(u||""));
const lien=(u,t)=>lienSur(u)?el("a",{href:u,target:"_blank",rel:"noopener",texte:t}):null;
const nomMois=m=>{const[a,mm]=m.split("-");return NOMS_MOIS[+mm-1].replace(/^./,c=>c.toUpperCase())+" "+a};
const dateCourte=d=>d?d.slice(8,10)+"/"+d.slice(5,7):"";
const ouvertes=p=>(p.actions||[]).filter(a=>a.statut==="proposee"||a.statut==="bloquee");
const moisDe=a=>(a.maj||a.mois||"").slice(0,7);
function dire(msg){const z=document.getElementById("enreg");if(z)z.textContent=msg}
function moisDuProjet(p){
  const s=new Set(Object.keys(p.mois||{}));s.add(ceMois);
  (p.actions||[]).forEach(a=>{if(a.statut==="faite"&&moisDe(a))s.add(moisDe(a))});
  if(etat.hote_mois)s.add(etat.hote_mois);
  return[...s].filter(m=>/^\d{4}-\d\d$/.test(m)).sort().reverse();
}
function courbe(serie){
  if(!serie||serie.length<2)return el("p",{class:"pl-vide",texte:"Moins de deux semaines de données Search Console : la courbe apparaît dès la deuxième semaine."});
  const L=640,H=140,m={g:36,d:12,h:12,b:26},max=Math.max(1,...serie.map(s=>s.clics));
  const x=i=>m.g+i*(L-m.g-m.d)/(serie.length-1),y=v=>H-m.b-(v/max)*(H-m.h-m.b);
  const ns="http://www.w3.org/2000/svg",svg=document.createElementNS(ns,"svg");
  svg.setAttribute("viewBox",`0 0 ${L} ${H}`);svg.setAttribute("role","img");
  svg.setAttribute("aria-label","Clics par semaine sur les dernières semaines, maximum "+max);
  const ajout=(t,a)=>{const n=document.createElementNS(ns,t);for(const k in a)n.setAttribute(k,a[k]);svg.append(n);return n};
  [0,.5,1].forEach(f=>{const v=Math.round(max*f),yy=y(v);ajout("line",{x1:m.g,x2:L-m.d,y1:yy,y2:yy,stroke:"var(--trait)","stroke-width":1});
    ajout("text",{x:m.g-6,y:yy+4,"text-anchor":"end","font-size":11,fill:"var(--doux)","font-family":"var(--chiffre)"}).textContent=v});
  const pts=serie.map((s,i)=>`${x(i)},${y(s.clics)}`).join(" ");
  ajout("polygon",{points:`${x(0)},${y(0)} ${pts} ${x(serie.length-1)},${y(0)}`,fill:"var(--accent-doux)"});
  ajout("polyline",{points:pts,fill:"none",stroke:"var(--accent)","stroke-width":2,"stroke-linejoin":"round"});
  const der=serie[serie.length-1];ajout("circle",{cx:x(serie.length-1),cy:y(der.clics),r:4,fill:"var(--accent)"});
  [0,serie.length-1].forEach(i=>ajout("text",{x:x(i),y:H-6,"text-anchor":i?"end":"start","font-size":11,fill:"var(--doux)"}).textContent="sem. du "+dateCourte(serie[i].semaine));
  return svg;
}
function chiffres(k){
  k=k||{};const v=k.clics_4s_prec?Math.round((k.clics_4s-k.clics_4s_prec)/k.clics_4s_prec*100):null;
  const tuile=(val,lib,extra)=>el("div",{class:"pl-chiffre"},el("b",{texte:val}),el("span",{},lib,extra||""));
  const t=[];
  if(k.clics_4s!=null)t.push(tuile(fr(k.clics_4s),"clics sur 4 semaines ",v==null?"":el("strong",{class:v>=0?"pl-var-plus":"pl-var-moins",texte:(v>=0?"+":"")+v+" %"})));
  if(k.impressions_4s!=null)t.push(tuile(fr(k.impressions_4s),"impressions sur 4 semaines"));
  if(k.clics!=null)t.push(tuile(fr(k.clics),"clics sur le mois"));
  if(k.impressions!=null)t.push(tuile(fr(k.impressions),"impressions sur le mois"));
  if(k.top_10!=null)t.push(tuile(fr(k.top_10)+(k.pages_suivies?"/"+fr(k.pages_suivies):""),"pages en top 10 sur leur mot-clé"));
  t.push(tuile(k.prompts||"—","prompts principaux où le site est cité"));
  return el("div",{class:"pl-chiffres"},...t);
}
function carteAction(a){
  const li=el("li",{class:"pl-action","data-statut":a.statut});
  const meta=el("div",{class:"pl-meta"},el("span",{class:"pl-type","data-type":a.type,texte:TYPES[a.type]||a.type||"Action"}),
    a.chantier?el("span",{texte:CHANTIERS[a.chantier]||a.chantier}):null,
    a.page?el("code",{texte:a.page}):null,a.gain?el("span",{texte:a.gain}):null,a.effort?el("span",{texte:"effort "+a.effort}):null,
    el("span",{class:"pl-statut",texte:(LIBELLES[a.statut]||a.statut)+(a.maj?" · "+dateCourte(a.maj):"")}));
  const corps=el("div",{class:"pl-corps"},el("div",{class:"pl-titre"},bidi(a.titre)),a.pourquoi?el("div",{class:"pl-meta"},bidi(a.pourquoi)):null,
    a.statut==="bloquee"&&a.attend?el("div",{class:"pl-attend",texte:"En attente : "+a.attend}):null,meta,
    a.note?el("div",{class:"pl-meta",texte:"Remarque : "+a.note}):null,lien(a.lien,"Voir le résultat"));
  const b=el("div",{class:"pl-boutons"});
  const changer=s=>()=>{const n=document.getElementById("note-"+a.id);if(n&&n.value.trim())a.note=n.value.trim();a.statut=s;if(s!=="bloquee")delete a.attend;a.maj=new Date().toISOString().slice(0,10);programmer();rendre()};
  if(a.statut==="proposee")b.append(el("button",{class:"pl-btn pl-oui",type:"button",disabled:lectureSeule,onclick:changer("validee"),texte:"Valider"}),
    el("button",{class:"pl-btn pl-non",type:"button",disabled:lectureSeule,onclick:changer("refusee"),texte:"Refuser"}));
  else if(a.statut==="bloquee")b.append(el("button",{class:"pl-btn pl-oui",type:"button",disabled:lectureSeule,onclick:changer("validee"),texte:"C'est débloqué"}));
  else if(a.statut==="validee"||a.statut==="refusee")b.append(el("button",{class:"pl-btn",type:"button",disabled:lectureSeule,onclick:changer("proposee"),texte:"Remettre à valider"}));
  li.append(corps,b);
  if((a.statut==="proposee"||a.statut==="bloquee")&&!lectureSeule)li.append(el("div",{class:"pl-note"},el("input",{id:"note-"+a.id,type:"text",placeholder:"Remarque pour Claude (facultatif)","aria-label":"Remarque pour "+a.titre,value:a.note||""})));
  return li;
}
function parChantier(actions,rendu){
  const g={};actions.forEach(a=>{(g[a.chantier||"pilotage"]=g[a.chantier||"pilotage"]||[]).push(a)});
  const ordre=Object.keys(CHANTIERS).concat(Object.keys(g).filter(c=>!(c in CHANTIERS)));
  return ordre.filter(c=>g[c]).map(c=>el("div",{class:"pl-groupe"},el("h3",{texte:(CHANTIERS[c]||c)+" · "+g[c].length}),rendu(g[c])));
}
