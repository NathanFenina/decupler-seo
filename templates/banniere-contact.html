<!--
  Bannière contact / devis — Claude Code SEO Décupler
  Elle déclenche l'action ; la bannière E-E-A-T (banniere-eeat.html) prouve
  qui parle. Ne pas fusionner les deux : une bannière qui fait tout ne fait
  rien, et le lecteur doit voir la preuve avant la demande.
  Une action principale, la même que le CTA de la page ; le téléphone en second.

<div class="dcp-contact">
<style>
.dcp-contact{overflow-x:hidden}
.dcp-contact *{box-sizing:border-box}

  width:100vw;background:#0B7285;color:#fff;text-align:center;
  padding:clamp(2rem,5vw,3rem) clamp(1rem,4vw,3rem);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.6}
.dcp-contact h2{font-size:clamp(1.4rem,3vw,2rem);margin:0 0 .5rem;color:#fff}
.dcp-contact p{margin:0 auto 1.4rem;max-width:56ch;color:#E3F4F7}
.dcp-contact .dcp-contact-actions{display:flex;flex-wrap:wrap;gap:.75rem;justify-content:center}
.dcp-contact a{display:inline-block;padding:.9rem 1.8rem;border-radius:12px;font-weight:700;text-decoration:none}
.dcp-contact .dcp-contact-principal{background:#fff;color:#0B7285}
.dcp-contact .dcp-contact-secondaire{border:2px solid #fff;color:#fff}
</style>
  <section class="dcp-contact-bande">
    <h2>[Promesse concrète : devis sous 48 h, intervention sous 2 h…]</h2>
    <p>[Une phrase : ce qui se passe après la demande, et en combien de temps.]</p>
    <div class="dcp-contact-actions">
      <a class="dcp-contact-principal" href="[URL réelle de la page devis]">[Demander un devis]</a>
      <a class="dcp-contact-secondaire" href="tel:[+33XXXXXXXXX]">[Numéro affiché]</a>
    </div>
  </section>
</div>
