schema_version: "1.1"
name: projet-maillage-reel
description: "Parcours réel : maillage entrant d'une page avec maillage_entrant.py sur les exports du projet"
tags: [projet, durci]
runs: 1
context:
  scaffold_script: preparer.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  prompt: |
    Le projet est configuré dans ce dossier ; les exports du crawl et de la Search Console sont dans donnees/.
    Quels liens internes ajouter ou corriger pour renforcer https://exemple-plomberie.fr/pompe-a-chaleur/ sur « pompe à chaleur air-eau » ?
graders:
  - name: skill-maillage
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-(?:maillage-interne|optimisation-onpage)"'
  - name: script-maillage
    type: tool_used
    tool: Bash
    input_match: 'maillage_entrant\.py'
  - name: resultat
    type: llm
    criteria: |
      PASS si la réponse : (1) signale l'ancre concurrente « pompe à chaleur air-eau » qui pointe vers /guide-pac/ depuis /blog/guide-chauffage/ et propose de la retirer ou de la changer ;
      (2) recommande un lien depuis /blog/cop-pompe-a-chaleur/ (page la plus forte) vers la page cible ;
      (3) signale l'ancre générique « cliquez ici » à remplacer ;
      (4) dose les liens à ajouter selon la force de la page mesurée par l'outil (page moyenne : 2 à 3 liens nouveaux, corrections d'ancres en plus), avec des ancres variées et l'ancre exacte une seule fois.
      FAIL si l'ancre concurrente n'est pas relevée, ou si la réponse recommande de mettre l'ancre exacte sur tous les liens.
