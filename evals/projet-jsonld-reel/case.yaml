schema_version: "1.1"
name: projet-jsonld-reel
description: "Parcours réel : générer et valider le JSON-LD d'une page avec schema_build.py et le socle du projet"
tags: [projet, durci]
runs: 1
context:
  scaffold_script: preparer.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill, Bash, Write]
  prompt: |
    Le projet est configuré dans ce dossier (schema/socle-global.json, schema/pages/, memoire/entites.csv).
    Génère le JSON-LD de la page « Plombier à Lyon » et écris-le dans schema/plombier-lyon.jsonld. Il doit passer la validation.
graders:
  - name: skill-schema
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?seo-schema-jsonld"'
  - name: script-build
    type: tool_used
    tool: Bash
    input_match: 'schema_build\.py'
  - name: fichier-ecrit
    type: file_exists
    path: schema/plombier-lyon.jsonld
  - name: resultat
    type: llm
    criteria: |
      PASS si la réponse : (1) décrit un seul @graph réunissant le socle (Plumber, WebSite) et les nœuds de la page (WebPage, Service, BreadcrumbList, FAQPage) ;
      (2) indique que le JSON-LD vient du générateur et que la validation passe sans erreur ;
      (3) ne promet pas d'affichage enrichi de la FAQ dans Google (retiré en 2026) ;
      (4) n'invente aucun identifiant Wikidata : une entité sans QID dans le registre (Plomberie) reste sans sameAs ou est signalée à vérifier.
      FAIL si le JSON-LD est écrit à la main sans passer par le générateur, ou si un QID absent du registre est ajouté.
